[package]
name = "cuestage"
version = "0.1.0"
description = "CueStage — control de música y efectos de sonido para presentaciones en vivo"
authors = ["CueStage"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = ""
default-run = "cuestage"

[lib]
name = "cuestage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
